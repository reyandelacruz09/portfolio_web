<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reyan DeLa Cruz | Software Developer</title>
    <script>
      // GitHub Pages returns 404 for deep links (e.g. /portfolio_web/admin).
      // Redirect to index.html with the path encoded in the query string;
      // index.html restores it with history.replaceState (spa-github-pages).
      var pathSegmentsToKeep = 1; // /portfolio_web

      var l = window.location;
      var lastSegment = l.pathname.split("/").pop();
      if (lastSegment.indexOf(".") !== -1) {
        // Missing static file: show a real 404 instead of redirecting.
      } else {
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
        );
      }
    </script>
  </head>
  <body></body>
</html>
